<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>03 SVG 与表格</title></head>
<body>
  <h1>数据看板</h1>
  <svg width="200" height="120" viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
    <rect x="10" y="10" width="80" height="100" fill="#4f86f7"/>
    <rect x="110" y="40" width="80" height="70" fill="#f7b84f"/>
    <text x="50" y="115" text-anchor="middle">Q1</text>
  </svg>
  <table class="data-table">
    <thead><tr><th>季度</th><th>营收</th></tr></thead>
    <tbody>
      <tr><td>Q1</td><td>120万</td></tr>
      <tr><td>Q2</td><td>150万</td></tr>
    </tbody>
  </table>
</body>
</html>
