<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>多文件页面夹具 · 易页 P0-7</title>
  <!-- ↓↓↓ 这两行是本夹具存在的全部理由：它们让这份 html 不再是单文件 ↓↓↓ -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="rail">
    <h1>多文件页面</h1>
    <p class="lead">这份文档依赖同目录的 <code>styles.css</code> 与 <code>app.js</code>。</p>
  </header>

  <main>
    <section class="card">
      <h2>为什么需要这个夹具</h2>
      <p id="explain">
        真实事故：一份三件套站点（index.html + styles.css + app.js）被存到桌面后，
        同目录的两个依赖没跟过去，整页版式塌成流内文字 —— 看起来像编辑器把内容改坏了。
      </p>
      <p>所以保存之前就必须能看见：依赖谁、必须存回哪个目录。</p>
    </section>

    <section class="card">
      <h2>可点区域</h2>
      <p id="tick">脚本还没跑起来。</p>
      <button id="btn" type="button">点我</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
